# =============================================================================
#  iLO4 Fan Controller + Home Assistant (+ Broadlink RM Mini for the A/C)
#  Copy to /config/packages/ilo4_fans.yaml and enable packages:
#
#    homeassistant:
#      packages: !include_dir_named packages
#
#  /config/secrets.yaml:
#    ilo4_fans_api: "http://192.168.1.50:3000/api/fans"
#    ilo4_fans_unlock: "http://192.168.1.50:3000/api/fans/unlock"
#    ilo_thermal_url: "https://192.168.1.69/redfish/v1/chassis/1/Thermal"
#    ilo_username: "homeassistant"   # read-only iLO user is enough for temps
#    ilo_password: "xxx"
# =============================================================================

rest:
  # --- Fans (via the controller) ---------------------------------------------
  - resource: !secret ilo4_fans_api
    scan_interval: 30
    timeout: 20
    sensor:
      - name: "iLO fans average"
        unique_id: ilo4_fans_average
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:fan
        value_template: >
          {% set v = value_json.fans | map(attribute='CurrentReading') | list %}
          {{ (v | sum / v | count) | round(0) if v | count > 0 else none }}
        # Full fan list kept as attribute -> used to count fans automatically
        json_attributes:
          - fans
      - name: "iLO fans max"
        unique_id: ilo4_fans_max
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:fan-chevron-up
        value_template: >
          {% set v = value_json.fans | map(attribute='CurrentReading') | list %}
          {{ v | max if v | count > 0 else none }}

  # --- Temperatures (directly from the iLO Redfish API) ----------------------
  - resource: !secret ilo_thermal_url
    authentication: basic
    username: !secret ilo_username
    password: !secret ilo_password
    verify_ssl: false   # self-signed iLO certificate
    scan_interval: 60
    timeout: 20
    sensor:
      - name: "iLO inlet temperature"
        unique_id: ilo_temp_inlet
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        value_template: >
          {% set t = value_json.Temperatures | selectattr('Name', 'search', 'Inlet Ambient') | first %}
          {{ t.ReadingCelsius if t.ReadingCelsius is defined else t.CurrentReading }}
      - name: "iLO hottest CPU"
        unique_id: ilo_temp_cpu_max
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        value_template: >
          {% set ns = namespace(m=0) %}
          {% for t in value_json.Temperatures | selectattr('Name', 'search', 'CPU') %}
            {% set r = t.ReadingCelsius if t.ReadingCelsius is defined else t.CurrentReading %}
            {% if r is number and r > ns.m %}{% set ns.m = r %}{% endif %}
          {% endfor %}
          {{ ns.m }}
      - name: "iLO RAID controller temperature"
        unique_id: ilo_temp_raid_controller
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        value_template: >
          {% set t = value_json.Temperatures | selectattr('Name', 'search', 'HD Controller') | list %}
          {% if t %}{{ t[0].ReadingCelsius if t[0].ReadingCelsius is defined else t[0].CurrentReading }}{% else %}{{ none }}{% endif %}
      # Smallest gap (°C) between ANY sensor and its own critical threshold.
      # Room inlet sensors are excluded (handled by the A/C automations).
      # Catches every component (CPU, RAID controller, PSU, DIMMs...).
      - name: "iLO thermal margin"
        unique_id: ilo_thermal_margin
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:thermometer-alert
        value_template: >
          {% set ns = namespace(m=999, worst='') %}
          {% for t in value_json.Temperatures %}
            {% set r = t.ReadingCelsius if t.ReadingCelsius is defined else t.CurrentReading %}
            {% set c = t.UpperThresholdCritical | default(0) %}
            {% if 'Inlet' not in t.Name and r is number and c is number and r > 0 and c > 0 and (c - r) < ns.m %}
              {% set ns.m = c - r %}
            {% endif %}
          {% endfor %}
          {{ ns.m if ns.m < 999 else none }}
        json_attributes_path: "$"
        json_attributes:
          - Temperatures
      - name: "iLO hottest sensor"
        unique_id: ilo_hottest_sensor
        icon: mdi:thermometer-high
        value_template: >
          {% set ns = namespace(m=999, worst='unknown') %}
          {% for t in value_json.Temperatures %}
            {% set r = t.ReadingCelsius if t.ReadingCelsius is defined else t.CurrentReading %}
            {% set c = t.UpperThresholdCritical | default(0) %}
            {% if 'Inlet' not in t.Name and r is number and c is number and r > 0 and c > 0 and (c - r) < ns.m %}
              {% set ns.m = c - r %}
              {% set ns.worst = t.Name ~ ' ' ~ r ~ '/' ~ c ~ '°C' %}
            {% endif %}
          {% endfor %}
          {{ ns.worst }}

rest_command:
  # Same speed on every fan; the number of fans is read from the sensor.
  # mode "min" (default here) = floor only, iLO can still speed fans up.
  # mode "lock" = fixed speed, iLO regulation disabled (emergency use only).
  ilo4_fans_set:
    url: !secret ilo4_fans_api
    method: POST
    content_type: "application/json"
    timeout: 90   # one SSH command per fan, can take 10-20 s
    payload: >
      {% set n = (state_attr('sensor.ilo_fans_average', 'fans') or []) | count %}
      {"fans": {{ [speed | int] * n }}, "mode": "{{ mode | default('min') }}"}
  # Give control back to the iLO automatic thermal regulation
  ilo4_fans_unlock:
    url: !secret ilo4_fans_unlock
    method: POST
    timeout: 60

input_number:
  # --- A/C thresholds, adjustable from the dashboard ---
  # No "initial": values set in the UI survive restarts. After the first
  # install, set them once: on 27, setpoint 24, off 22, alert 30.
  clim_seuil_on:
    name: Clim - allumer au-dessus de
    min: 24
    max: 32
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up
  clim_consigne:
    name: Clim - consigne
    min: 18
    max: 28
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermostat
  clim_seuil_off:
    name: Clim - éteindre en dessous de
    min: 16
    max: 26
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-down
  clim_alerte:
    name: Clim - alerte si toujours au-dessus de
    min: 26
    max: 35
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-alert

  # --- Fan floor by presence (Alarmo state) ---
  # Set once from the UI after install: home 30, away 45.
  ilo_fans_home:
    name: Ventilos - plancher présent
    min: 10
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:home
  ilo_fans_away:
    name: Ventilos - plancher absent
    min: 10
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:home-export-outline

  ilo_fans_target:
    name: Server fans minimum
    min: 10
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:fan

script:
  ilo_fans_auto:
    alias: "Server fans - automatic (iLO)"
    icon: mdi:fan-auto
    sequence:
      - service: rest_command.ilo4_fans_unlock

automation:
  # Slider -> minimum speed (iLO keeps regulating above it)
  - id: ilo4_fans_slider
    alias: "iLO - apply fan slider"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_number.ilo_fans_target
        for: "00:00:02"   # debounce while dragging
    action:
      - service: rest_command.ilo4_fans_set
        data:
          speed: "{{ states('input_number.ilo_fans_target') | int }}"

  # Room too hot -> A/C on + fans 50 %
  # ---------------------------------------------------------------------------
  #  A/C: Home Assistant only switches the A/C on/off and alerts.
  #  The A/C's own thermostat keeps the room at the setpoint.
  #  Room sensor: sensor.rm4_mini_temperature (or sensor.ilo_inlet_temperature)
  #  Notifications: adapt notify.mobile_app_iphone_de_cyril to your phone.
  # ---------------------------------------------------------------------------

  # Room too warm -> A/C on (cool, setpoint)
  - id: clim_on
    alias: "Clim - allumer si trop chaud"
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.rm4_mini_temperature
        above: input_number.clim_seuil_on
        for: "00:05:00"
      # periodic check: covers HA restarts and missed crossings
      - platform: time_pattern
        minutes: "/15"
    condition:
      - condition: numeric_state
        entity_id: sensor.rm4_mini_temperature
        above: input_number.clim_seuil_on
      - condition: state
        entity_id: climate.serveur_ac
        state: "off"
    action:
      - service: climate.set_temperature
        target:
          entity_id: climate.serveur_ac
        data:
          hvac_mode: cool
          temperature: "{{ states('input_number.clim_consigne') | int }}"
      - service: notify.mobile_app_iphone_de_cyril
        data:
          title: "❄️ Clim allumée"
          message: >
            Pièce à {{ states('sensor.rm4_mini_temperature') }} °C,
            consigne {{ states('input_number.clim_consigne') | int }} °C.

  # Room naturally cool (A/C cannot heat: this happens in winter / at night)
  - id: clim_off
    alias: "Clim - éteindre si la pièce est fraîche"
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.rm4_mini_temperature
        below: input_number.clim_seuil_off
        for: "00:30:00"
      - platform: time_pattern
        minutes: "/15"
    condition:
      - condition: numeric_state
        entity_id: sensor.rm4_mini_temperature
        below: input_number.clim_seuil_off
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.serveur_ac
            state: "off"
    action:
      - service: climate.turn_off
        target:
          entity_id: climate.serveur_ac
      - service: notify.mobile_app_iphone_de_cyril
        data:
          title: "🌙 Clim éteinte"
          message: "Pièce à {{ states('sensor.rm4_mini_temperature') }} °C."

  # A/C on but the room keeps heating -> something is wrong
  - id: clim_alerte
    alias: "Clim - alerte inefficace"
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.rm4_mini_temperature
        above: input_number.clim_alerte
        for: "00:30:00"
    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.serveur_ac
            state: "off"
    action:
      - service: notify.mobile_app_iphone_de_cyril
        data:
          title: "⚠️ Clim inefficace"
          message: >
            Clim allumée mais pièce à {{ states('sensor.rm4_mini_temperature') }} °C
            depuis 30 min. Bac à eau plein ? Gaine débranchée ? Ordre IR non reçu ?
            P420i : {{ states('sensor.ilo_raid_controller_temperature') }} °C.

  # Fan floor follows the alarm: quieter when someone is home, more cooling
  # margin when nobody is. Still a FLOOR ("min" mode): the iLO can go higher.
  - id: ilo_fans_presence
    alias: "Ventilos - plancher selon l'alarme"
    mode: restart
    trigger:
      - platform: state
        entity_id: alarm_control_panel.alarmo
        to:
          - disarmed
          - armed_home
          - armed_night
          - armed_away
          - armed_vacation
      - platform: homeassistant
        event: start
      # also when the values are changed from the dashboard
      - platform: state
        entity_id:
          - input_number.ilo_fans_home
          - input_number.ilo_fans_away
    condition:
      # never override the thermal emergency (fans locked at 100 %)
      - condition: numeric_state
        entity_id: sensor.ilo_thermal_margin
        above: 15
    action:
      - delay: "00:00:05"
      - service: input_number.set_value
        target:
          entity_id: input_number.ilo_fans_target
        data:
          value: >
            {% if states('alarm_control_panel.alarmo') in ['armed_away', 'armed_vacation'] %}
              {{ states('input_number.ilo_fans_away') | float(45) }}
            {% else %}
              {{ states('input_number.ilo_fans_home') | float(30) }}
            {% endif %}

  # SAFETY NET: any sensor (CPU, RAID controller "HD Controller", PSU...)
  # gets close to its critical threshold -> fans 100 % immediately.
  # "lock" mode disables iLO regulation, so this automation is MANDATORY.
  - id: ilo_thermal_emergency
    alias: "iLO - thermal emergency"
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.ilo_thermal_margin
        below: 15          # °C left before the critical threshold
      - platform: numeric_state
        entity_id: sensor.ilo_hottest_cpu
        above: 75
      - platform: state    # temperatures lost = assume the worst
        entity_id: sensor.ilo_thermal_margin
        to: "unavailable"
        for: "00:05:00"
    action:
      # Direct call (no slider debounce): every fan locked at 100 %
      - service: rest_command.ilo4_fans_set
        data:
          speed: 100
          mode: lock
      - service: input_number.set_value
        target:
          entity_id: input_number.ilo_fans_target
        data:
          value: 100
      - service: notify.mobile_app_iphone_de_cyril
        data:
          title: "🚨 Serveur en surchauffe"
          message: >
            Ventilos forcés à 100 %. {{ states('sensor.ilo_hottest_sensor') }}
            (marge {{ states('sensor.ilo_thermal_margin') }} °C).
      - service: persistent_notification.create
        data:
          title: "Server overheating"
          message: >
            Fans forced to 100 %. Closest to critical: {{ states('sensor.ilo_hottest_sensor') }}
            (margin {{ states('sensor.ilo_thermal_margin') }}°C).
            Use "Server fans - automatic (iLO)" once it has cooled down.
