smartir:

climate:
  - platform: smartir
    name: Clim garage
    unique_id: clim_garage
    # 1390 = Midea RG52C1/BGE remote, works with many Midea-made units
    # (Domo DO263A: 17-30 °C, cool/dry/fan_only, NO heat).
    # If it does not respond, use the custom profile 9001 (learned codes).
    device_code: 1390
    controller_data: remote.rm_mini
    # Optional but recommended:
    temperature_sensor: sensor.garage_temperature
    humidity_sensor: sensor.garage_humidity
    # Real on/off state from a power-metering plug (see template below)
    power_sensor: binary_sensor.clim_garage_running

template:
  - binary_sensor:
      - name: "Clim garage running"
        unique_id: clim_garage_running
        device_class: running
        # Adjust the sensor and the threshold to your plug / A/C model
        state: "{{ states('sensor.prise_clim_power') | float(0) > 300 }}"
        delay_off: "00:01:00"
